name: 🐛 Bug Report
description: Create a report to help us fix a defect or regression
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a defect report! Please verify that the issue also occurs on the latest [Canary preview](https://revin-canary.vercel.app).
  - type: input
    id: summary
    attributes:
      label: Brief Summary
      description: A concise summary of the defect
      placeholder: e.g. Stepper increment wraps unexpectedly on mobile
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Engine (Math, Margins, Commercials, Exports)
        - Estimates View (Dashboard, List, Search)
        - Editor View (Scope, Build, Review, Calibration)
        - Library View (CMS, Services, Items, Packs)
        - Settings View (Financials, Team, Webhooks, Health)
        - Proposal Portal (Presentation Mode, Sign-off, Seal)
        - Responsive Layout / Viewports (320px - 2560px)
        - Database / Realtime (Supabase, RLS, Sync)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (Blocks production, data loss, security exposure)
        - High (Core workflow blocked, no workaround)
        - Medium (Functionality impaired, workaround exists)
        - Low (Cosmetic, minor layout or formatting issue)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the issue
      placeholder: |
        1. Open Settings -> Financials
        2. Set hourly rate to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: textarea
    id: telemetry
    attributes:
      label: Telemetry / Diagnostics Report
      description: Paste the Markdown report generated by the "Copy for AI" button in Settings -> Health & Diagnostics (if applicable).
      render: markdown
