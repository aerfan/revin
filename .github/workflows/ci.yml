name: CI

on:
  push:
    branches: [ "main", "canary" ]
  pull_request:
    branches: [ "main", "canary" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assemble & Build Local Standalone HTML
        run: npm run bundle:ui && node build.js

      - name: Run Engine Tests (5,754 fuzz & math checks)
        run: npm run test:engine

      - name: Run Security Penetration Suite (10 attack vectors)
        run: npm run test:security

      - name: Run Database Migration & PostgreSQL Security Tests
        run: npm run test:db
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: pg

      - name: Build Web Application Bundle (with strict gate)
        run: node web/build.js --strict
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-test.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-anon-key-placeholder' }}

      - name: Upload Build Artifacts (Node 20 only)
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: revin-build-artifacts
          path: |
            dist/design-hours-estimator.html
            dist-web/
          retention-days: 14

      - name: Generate Job Summary Report
        if: matrix.node-version == '20.x'
        run: |
          echo "### 🚀 Revin CI Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---:|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Engine Math & Fuzz** | ✅ Pass | 5,754 deterministic checks |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Suite** | ✅ Pass | 10 vulnerability surfaces verified |" >> $GITHUB_STEP_SUMMARY
          echo "| **PostgreSQL Integrity** | ✅ Pass | Migrations, triggers & RLS verified |" >> $GITHUB_STEP_SUMMARY
          echo "| **Standalone HTML** | ✅ Pass | Built \`dist/design-hours-estimator.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web App PWA** | ✅ Pass | Built \`dist-web/\` with tightened CSP |" >> $GITHUB_STEP_SUMMARY
