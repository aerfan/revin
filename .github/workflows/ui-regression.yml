name: UI Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]

jobs:
  full-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: python3 -m pip install --upgrade pip openpyxl
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
